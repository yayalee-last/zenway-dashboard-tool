<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="stylesheet" href="style.css" />
    <title>禅道挂件</title>
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 12 0-3 5v4l2 3H4l2-3V8L3 3h6M12 15v6"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7A7 7 0 0 1 18 5l2 2M4 17l2 2a7 7 0 0 0 11.9-2"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3-.7 2.2-2 .9-2.1-.5-2.5 4.3 1.5 1.7v2.3l-1.5 1.7 2.5 4.3 2.2-.5 1.9.9.7 2.2h5l.7-2.2 1.9-.9 2.2.5 2.5-4.3-1.5-1.7v-2.3l1.5-1.7-2.5-4.3-2.1.5-2-.9L14.5 3z"/><circle cx="12" cy="12.8" r="3"/></symbol>
        <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24"><path d="m5 4-3 9v6a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-6l-3-9zM2 13h6l2 3h4l2-3h6"/></symbol>
        <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="14" rx="5"/><path d="m8 3 2 4m6-4-2 4M3 9l4 2m-4 5h4m-3 5 4-3M21 9l-4 2m4 5h-4m3 5-4-3M12 11v6"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8zM2 12l10 5 10-5M2 16l10 5 10-5"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H5a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8zM14 2v6h6M8 13h8m-8 4h5"/></symbol>
      </defs>
    </svg>
    <div class="shell">
      <header class="titlebar">
        <div class="brand">
          <img class="brand-mark" src="../assets/icon.png" width="32" height="32" alt="" />
          <div class="brand-copy">
            <span class="title">禅道<span class="count" id="count">0</span></span>
            <span class="subtitle">桌面待办</span>
          </div>
        </div>
        <div class="actions">
          <button class="icon" id="btn-pin" title="窗口置顶" aria-label="窗口置顶">
            <svg class="glyph" aria-hidden="true"><use href="#i-pin"></use></svg>
          </button>
          <button class="icon" id="btn-refresh" title="刷新" aria-label="刷新">
            <svg class="glyph" aria-hidden="true"><use href="#i-refresh"></use></svg>
          </button>
          <button class="icon" id="btn-set" title="设置" aria-label="设置">
            <svg class="glyph" aria-hidden="true"><use href="#i-settings"></use></svg>
          </button>
          <button class="icon danger" id="btn-hide" title="收起（托盘常驻）" aria-label="收起到托盘">
            <svg class="glyph" aria-hidden="true"><use href="#i-minimize"></use></svg>
          </button>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-filter="open"><svg class="glyph" aria-hidden="true"><use href="#i-inbox"></use></svg><span>未完成</span></button>
        <button class="tab" data-filter="bug"><svg class="glyph" aria-hidden="true"><use href="#i-bug"></use></svg><span>缺陷</span></button>
        <button class="tab" data-filter="overdue"><svg class="glyph" aria-hidden="true"><use href="#i-clock"></use></svg><span>逾期</span></button>
        <button class="tab" data-filter="all"><svg class="glyph" aria-hidden="true"><use href="#i-layers"></use></svg><span>全部</span></button>
      </nav>

      <main class="list" id="list"></main>

      <section class="detail" id="detail" hidden>
        <div class="dt-head">
          <button class="icon" id="dt-back" title="返回列表（Esc）" aria-label="返回列表">
            <svg class="glyph" aria-hidden="true"><use href="#i-back"></use></svg>
          </button>
          <span class="dt-id" id="dt-id"></span>
          <div class="dt-tools">
            <button class="icon" id="dt-open" title="在浏览器打开" aria-label="在浏览器打开">
              <svg class="glyph" aria-hidden="true"><use href="#i-external"></use></svg>
            </button>
          </div>
        </div>
        <div class="dt-body" id="dt-body"></div>
        <div class="dt-foot" id="dt-foot" hidden></div>
      </section>

      <div class="update-bar" id="update-bar" hidden>
        <span class="ub-ico"><svg class="glyph" aria-hidden="true"><use href="#i-up"></use></svg></span>
        <span class="ub-text" id="ub-text"></span>
        <button class="ub-btn" id="ub-go">更新</button>
        <button class="icon ub-close" id="ub-close" title="这次先不管" aria-label="关闭更新提示">
          <svg class="glyph" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>

      <footer class="statusbar">
        <span id="status">等待刷新…</span>
        <button class="link" id="btn-settings-link">设置</button>
      </footer>

      <div class="modal" id="modal" hidden>
        <div class="panel">
          <div class="panel-head">
            <span>连接禅道</span>
            <button class="icon" id="btn-close-modal" aria-label="关闭设置">
              <svg class="glyph" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>

          <label class="field">
            <span>禅道地址</span>
            <input id="f-baseUrl" type="text" placeholder="http://your-zentao-host/zentao" spellcheck="false" />
            <em class="hint" id="base-hint">只填到端口/部署目录，index.php 会自动去掉</em>
          </label>

          <div class="row">
            <label class="field">
              <span>账号</span>
              <input id="f-account" type="text" spellcheck="false" />
            </label>
            <label class="field">
              <span>密码</span>
              <input id="f-password" type="password" />
            </label>
          </div>

          <div class="row">
            <label class="field">
              <span>刷新间隔（秒）</span>
              <input id="f-intervalSec" type="number" min="30" step="30" />
            </label>
            <label class="field">
              <span>链接格式</span>
              <select id="f-urlMode">
                <option value="path">/task-view-1.html</option>
                <option value="get">index.php?m=task…</option>
              </select>
            </label>
          </div>

          <label class="check">
            <input id="f-alwaysOnTop" type="checkbox" />
            <span>窗口置顶</span>
          </label>
          <label class="check">
            <input id="f-autoLaunch" type="checkbox" />
            <span>开机自启（静默到托盘）</span>
          </label>
          <label class="check">
            <input id="f-autoUpdate" type="checkbox" />
            <span>自动检查新版本（每 5 分钟）</span>
          </label>
          <label class="field">
            <span>显示模式</span>
            <select id="f-displayMode">
              <option value="ball">悬浮球（默认，悬停展开）</option>
              <option value="panel">常驻完整面板</option>
            </select>
          </label>
          <div class="row preview-options">
            <label class="check">
              <input id="f-showTopThree" type="checkbox" />
              <span>常驻显示前三条待办</span>
            </label>
            <select id="f-previewSide" aria-label="常驻待办优先显示位置">
              <option value="left">优先左侧</option>
              <option value="right">优先右侧</option>
            </select>
          </div>

          <div class="ver-line">
            <span id="ver-text">v—</span>
            <button class="ver-btn" id="btn-check-update">检查更新</button>
          </div>
          <div class="ver-note" id="ver-note" hidden></div>

          <div class="test-result" id="test-result" hidden></div>

          <div class="panel-foot">
            <button class="btn ghost" id="btn-test">测试连接</button>
            <button class="btn primary" id="btn-save">保存并刷新</button>
          </div>
        </div>
      </div>
      <div class="modal" id="task-modal" hidden>
        <div class="panel tight">
          <div class="panel-head">
            <span id="tm-title">开始任务</span>
            <button class="icon" id="tm-close" aria-label="关闭任务操作">
              <svg class="glyph" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
          <div class="tm-task" id="tm-task"></div>
          <div class="row">
            <label class="field">
              <span id="tm-consumed-label">预计消耗（小时）</span>
              <input id="tm-consumed" type="number" step="0.5" min="0" />
            </label>
            <label class="field">
              <span>剩余工时（小时）</span>
              <input id="tm-left" type="number" step="0.5" min="0" />
            </label>
          </div>
          <div class="test-result fail" id="tm-err" hidden></div>
          <div class="panel-foot">
            <button class="btn ghost" id="tm-cancel">取消</button>
            <button class="btn primary" id="tm-ok">确认</button>
          </div>
        </div>
      </div>

      <div class="modal" id="bug-modal" hidden>
        <div class="panel tight">
          <div class="panel-head">
            <span id="bm-title">解决缺陷</span>
            <button class="icon" id="bm-close" aria-label="关闭缺陷操作">
              <svg class="glyph" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
          <div class="tm-task" id="bm-task"></div>
          <div class="bm-fields" id="bm-resolve-fields">
            <div class="row">
              <label class="field">
                <span>解决方案</span>
                <select id="bm-resolution">
                  <option value="fixed">已解决</option>
                  <option value="bydesign">设计如此</option>
                  <option value="duplicate">重复 Bug</option>
                  <option value="external">外部原因</option>
                  <option value="notrepro">无法重现</option>
                  <option value="postponed">延期处理</option>
                  <option value="willnotfix">不予解决</option>
                  <option value="tostory">转需求</option>
                </select>
              </label>
              <label class="field">
                <span>解决版本</span>
                <input id="bm-build" type="text" placeholder="trunk" spellcheck="false" />
              </label>
            </div>
          </div>
          <label class="field">
            <span id="bm-comment-label">备注（可选）</span>
            <textarea id="bm-comment" rows="3" placeholder="改了什么 / 为什么这么解决" spellcheck="false"></textarea>
          </label>
          <div class="test-result fail" id="bm-err" hidden></div>
          <div class="panel-foot">
            <button class="btn ghost" id="bm-cancel">取消</button>
            <button class="btn primary" id="bm-ok">确认</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast" hidden></div>
    </div>

    <script src="item-order.js"></script>
    <script src="app.js"></script>
  </body>
</html>
