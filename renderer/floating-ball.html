<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>禅道悬浮球</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; user-select: none; }
      .ball {
        -webkit-app-region: drag;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(239, 189, 112, .6);
        border-radius: 50%;
        background: linear-gradient(145deg, #37332e, #1b1d23);
        box-shadow: 0 3px 8px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .12);
      }
      .ball:hover { border-color: #efbd70; background: linear-gradient(145deg, #514332, #22252c); }
      img { width: 28px; height: 28px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="ball" role="img" aria-label="禅道待办，悬停展开，拖动移动" title="禅道待办 · 悬停展开，拖动移动">
      <img src="../assets/icon.png" alt="" draggable="false" />
    </div>
  </body>
</html>
